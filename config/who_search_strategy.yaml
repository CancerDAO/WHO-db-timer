    title_term: adenocarcinoma OR neuroblastoma OR retinoblastoma OR medulloblastoma OR hepatoblastoma OR nephroblastoma OR osteosarcoma OR rhabdomyosarcoma OR mesothelioma OR cholangiocarcinoma OR myelodysplastic OR myeloproliferative OR hodgkin OR ewing
    condition_term: adenocarcinoma OR neuroblastoma OR retinoblastoma OR medulloblastoma OR hepatoblastoma OR nephroblastoma OR osteosarcoma OR rhabdomyosarcoma OR mesothelioma OR cholangiocarcinoma OR myelodysplastic OR myeloproliferative OR hodgkin OR ewing
    rationale: Rescue query for named tumor families if quality report shows expected registry IDs missing.
